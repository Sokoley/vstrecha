# Локальная разработка: MariaDB в Docker + приложение.
# Запуск: docker compose -f docker-compose.dev.yml up --build

services:
  mariadb:
    image: mariadb:10.3
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vstrecha
      MYSQL_USER: db_wp_user
      MYSQL_PASSWORD: localpass
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - vstrecha_mysql:/var/lib/mysql

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://db_wp_user:localpass@mariadb:3306/vstrecha
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      - mariadb

volumes:
  vstrecha_mysql:
