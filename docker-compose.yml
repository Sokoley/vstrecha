# Продакшен для ispmanager: приложение в Docker, MariaDB на хосте.
# network_mode: host — чтобы 127.0.0.1 в DATABASE_URL указывал на MariaDB хоста.

services:
  app:
    build: .
    container_name: vstrecha-app
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_APP_URL: "https://vstrecha.smazka.ru"
