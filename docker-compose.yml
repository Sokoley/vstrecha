# Продакшен для ispmanager: приложение в Docker, MariaDB на хосте.
# Порты на этом сервере:
#   brand.smazka.ru → :3000
#   stat.smazka.ru  → :3001
#   vstrecha       → :3002
# network_mode: host — 127.0.0.1 в DATABASE_URL = MariaDB на хосте.

services:
  app:
    build: .
    container_name: vstrecha-app
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3002"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_APP_URL: "https://vstrecha.smazka.ru"
